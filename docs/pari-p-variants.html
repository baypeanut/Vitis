<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pari P — Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,200;1,300&family=DM+Sans:wght@300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0D0A09; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:44px; padding:64px 24px;
}
.sup { font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:rgba(237,228,213,.22); }
.row { display:flex; gap:36px; flex-wrap:wrap; justify-content:center; }
.cell { display:flex; flex-direction:column; align-items:center; gap:14px; }
.shell {
  width:200px; height:200px; border-radius:44px; position:relative; overflow:hidden;
  box-shadow: 0 4px 12px rgba(0,0,0,.6), 0 14px 44px rgba(0,0,0,.55),
              0 28px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.shell::after {
  content:''; position:absolute; inset:0; border-radius:44px; pointer-events:none; z-index:20;
  background:linear-gradient(148deg, rgba(255,255,255,.085) 0%, rgba(255,255,255,.01) 40%, transparent 62%);
}
.lbl { font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(237,228,213,.3); }
</style>
</head>
<body>
<div class="sup">Pari · Monogramme · 3 Variants</div>
<div class="row">

<!-- ════════════════════════════════════
     SHARED DEFS — referenced in all 3
     ════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <!-- Ruby grape — realistic 3D light from top-left -->
    <radialGradient id="ruby" cx="30%" cy="22%" r="72%" fx="30%" fy="22%">
      <stop offset="0%"   stop-color="#F09090"/>
      <stop offset="8%"   stop-color="#D04060"/>
      <stop offset="38%"  stop-color="#901828"/>
      <stop offset="75%"  stop-color="#400810"/>
      <stop offset="100%" stop-color="#180306"/>
    </radialGradient>
    <!-- Darker ruby for back/upper berries -->
    <radialGradient id="ruby_dk" cx="30%" cy="22%" r="72%" fx="30%" fy="22%">
      <stop offset="0%"   stop-color="#D07080"/>
      <stop offset="8%"   stop-color="#A82840"/>
      <stop offset="38%"  stop-color="#700E1C"/>
      <stop offset="75%"  stop-color="#300608"/>
      <stop offset="100%" stop-color="#100204"/>
    </radialGradient>
    <!-- Gold grape (twin) -->
    <radialGradient id="gold" cx="30%" cy="22%" r="72%" fx="30%" fy="22%">
      <stop offset="0%"   stop-color="#F0D890"/>
      <stop offset="8%"   stop-color="#C89838"/>
      <stop offset="38%"  stop-color="#886010"/>
      <stop offset="75%"  stop-color="#3C2806"/>
      <stop offset="100%" stop-color="#160E02"/>
    </radialGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leaf_gr" x1=".4" y1="0" x2=".6" y2="1">
      <stop offset="0%"   stop-color="#B89840"/>
      <stop offset="100%" stop-color="#7A6020"/>
    </linearGradient>
    <!-- Stem/tendril -->
    <linearGradient id="stm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D4B060"/>
      <stop offset="100%" stop-color="#8A6828"/>
    </linearGradient>
    <!-- Drop shadow for cluster -->
    <filter id="bshadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
</svg>

</svg>
</div>
<span class="lbl">A — 14 berry</span>
</div>
