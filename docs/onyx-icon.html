<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#222; display:flex; align-items:center; justify-content:center; min-height:100vh; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
async function waitForFonts() {
  await document.fonts.ready;
}

async function draw() {
  await waitForFonts();
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const S = 1024;

  // Background gradient: deep garnet → near-black
  const bg = ctx.createRadialGradient(S*0.4, S*0.35, 0, S*0.5, S*0.5, S*0.75);
  bg.addColorStop(0,   '#2A1018');
  bg.addColorStop(0.45,'#1A0A0E');
  bg.addColorStop(1,   '#0B0507');

  // Rounded rect clip
  const r = 224; // iOS icon corner radius at 1024px
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(S-r, 0);
  ctx.quadraticCurveTo(S, 0, S, r);
  ctx.lineTo(S, S-r);
  ctx.quadraticCurveTo(S, S, S-r, S);
  ctx.lineTo(r, S);
  ctx.quadraticCurveTo(0, S, 0, S-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.save();
  ctx.clip();

  // Subtle vignette
  const vig = ctx.createRadialGradient(S/2, S/2, S*0.25, S/2, S/2, S*0.75);
  vig.addColorStop(0,   'rgba(0,0,0,0)');
  vig.addColorStop(1,   'rgba(0,0,0,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, S, S);

  // "pari" text — Cormorant Garamond, light weight, warm cream
  ctx.font = '300 192px "Cormorant Garamond"';
  ctx.fillStyle = '#EDE4D5';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = '14px';
  ctx.fillText('pari', S/2, S/2 + 36);

  // Ruby dot beneath — small, centered
  const dotY = S/2 + 36 + 54;
  const dotR = 14;
  const dotGrad = ctx.createRadialGradient(S/2 - 4, dotY - 4, 1, S/2, dotY, dotR);
  dotGrad.addColorStop(0,   '#F09090');
  dotGrad.addColorStop(0.15,'#D04060');
  dotGrad.addColorStop(0.5, '#901828');
  dotGrad.addColorStop(1,   '#400810');
  ctx.beginPath();
  ctx.arc(S/2, dotY, dotR, 0, Math.PI*2);
  ctx.fillStyle = dotGrad;
  ctx.fill();

  // Gloss overlay
  const gloss = ctx.createLinearGradient(0, 0, S*0.6, S*0.55);
  gloss.addColorStop(0,   'rgba(255,255,255,0.07)');
  gloss.addColorStop(0.5, 'rgba(255,255,255,0.01)');
  gloss.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = gloss;
  ctx.fillRect(0, 0, S, S);

  ctx.restore();

  // Export
  window._iconDataURL = c.toDataURL('image/png');
  window._iconReady = true;
  document.title = 'READY';
}

draw();
</script>
</body>
</html>
